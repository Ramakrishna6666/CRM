<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"/>
    <title>Search for customer</title>
</head>
<body>

<h2>Search customer by Last Name</h2>
<form th:action="@{|/customer/last-name-search|}" th:object="${customer}" method="post">
    <div>
        <label>
            Last Name:
            <input type="text" th:field="*{lastName}"/>
        </label>
    </div>
    <div>
        <input type="submit" value="Search Customer"/>
    </div>
</form>

</body>
</html>
