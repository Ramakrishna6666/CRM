<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"/>
    <title>Search contracts by user</title>
</head>
<body>

<h2>Search contracts by user</h2>
<form th:action="@{|/contract/user-search|}" th:object="${contract}" method="post">
    <div>
        <label>
            User:
            <select th:field="*{user.id}">
                <option th:each="user : ${users}"
                        th:value="${user.id}" th:text="${user}">
                </option>
            </select>
        </label>
    </div>
    <div>
        <input type="submit" value="Search Contract"/>
    </div>
</form>

</body>
</html>
