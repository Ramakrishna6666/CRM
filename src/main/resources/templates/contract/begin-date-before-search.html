<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"/>
    <title>Search contract by begin date before</title>
</head>
<body>

<h2>Search contract by begin date before</h2>
<form th:action="@{|/contract/begin-date-before-search|}" th:object="${contract}" method="post">
    <div>
        <label>
            Begin Date:
            <input type="date" th:field="*{beginDate}"/>
        </label>
    </div>
    <div>
        <input type="submit" value="Search Contract"/>
    </div>
</form>

</body>
</html>
