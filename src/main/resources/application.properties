spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# Azure Blob Storage Configuration for cloud-native file storage
# Replaces local file system writes with Azure Blob Storage for data durability
# and availability across container restarts and scaling events

# Option 1: Connection String (for development/testing)
# Set as environment variable: AZURE_STORAGE_CONNECTION_STRING
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Option 2: Managed Identity (recommended for production in Azure)
# Set as environment variable: AZURE_STORAGE_ACCOUNT_NAME
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}

# Container name for storing PDF files
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:pdf-files}

# Azure Service Bus Configuration for distributed, timezone-agnostic scheduled operations
# Replaces java.util.Timer and server-local scheduling with cloud-native message scheduling
# Set as environment variable: AZURE_SERVICEBUS_CONNECTION_STRING
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}

# Queue name for scheduled messages
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}

# Timezone configuration - Always use UTC for cloud deployments
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
