spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# AWS S3 Configuration for cloud-native storage
# These can be overridden by environment variables in cloud deployments
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-data-bucket}
aws.s3.pdf.bucket.name=${S3_PDF_BUCKET_NAME:crm-pdf-bucket}
aws.s3.pdf.prefix=${S3_PDF_PREFIX:pdfs/}
aws.region=${AWS_REGION:us-east-1}

# Timezone configuration - standardize on UTC for cloud environments
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.thymeleaf.cache=false
