spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

aws.s3.bucket=${S3_BUCKET_NAME:crm-data-bucket}
aws.region=${AWS_REGION:us-east-1}
# Prefix for PDF files in S3 bucket
aws.s3.pdf.prefix=${S3_PDF_PREFIX:pdfs/}

# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (for local development)
# In production, use IAM roles for EC2/ECS/EKS
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false
