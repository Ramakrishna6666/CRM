spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# AWS S3 Configuration for cloud-native storage
aws.s3.bucket.name=${AWS_S3_BUCKET:crm-data-bucket}
aws.region=${AWS_REGION:us-east-1}
aws.s3.pdf.prefix=pdfs/
aws.s3.csv.prefix=csv-files/

# Cloud-native configuration: Use environment variables for sensitive data
# AWS credentials are automatically loaded from IAM roles in cloud environments
spring.thymeleaf.cache=false
